name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest

  benchmark:
    # Generate a fresh world, reconcile it and fail if the engine disagrees with the ground truth
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: vre generate data/world --vendors 40 --po-lines 200000 --seed ${{ github.run_number }}
      - run: vre run data/world/observed --out out --pdf-top 3
      - run: vre evaluate out/findings.parquet data/world/truth/truth.parquet --out out/scorecard.json
      - name: Fail on any disagreement with the ground truth
        run: |
          python - <<'PY'
          import json, sys
          s = json.load(open("out/scorecard.json"))
          print({k: s[k] for k in ("verdict_mismatches", "claimable_precision", "claimable_recall", "false_claim_usd")})
          sys.exit(0 if s["verdict_mismatches"] == 0 and s["false_claim_usd"] == 0 else 1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard-and-sample-reports
          path: |
            out/scorecard.json
            out/summary.json
            out/vendors/*/recovery_*.pdf
