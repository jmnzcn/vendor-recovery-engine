[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vendor-recovery-engine"
version = "0.1.0"
description = "Reconciliation and recovery engine for Amazon Vendor Central deductions: messy files in, defensible claims out, every finding traceable to its source row."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ney Fred Jiménez Campos" }]
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "python-calamine>=0.2",
  "pandera>=0.20",
  "rapidfuzz>=3.6",
  "reportlab>=4.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5"]
ai = ["anthropic>=2.0"]  # vre drafts --model: Claude-drafted dispute letters

[project.scripts]
vre = "vre.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vre = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end runs on a generated dataset"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/vre/cli.py" = ["B008"]  # typer declares options as default values
